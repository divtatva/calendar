
[tool.poetry]
name = "divtatva-Calendar"
version = "0.1.0"
description = "Astrology Calendar for divtatva project"
authors = ["Kuldeep <sengarkuldeep@divtatva.com>"]
readme = "README.md"
packages = [{ include = "calendar_cli" }]


[tool.poetry.dependencies]
python = ">=3.13,<4"
attr = ">=0.3.2,<0.4.0"
geopy = ">=2.4.1,<3.0.0"
requests = ">=2.32.4,<3.0.0"
pytz = ">=2025.2,<2026.0"
numpy = ">=2.3.1,<3.0.0"
pandas = ">=2.3.1,<3.0.0"
pillow = ">=11.3.0,<12.0.0"
setuptools = ">=80.9.0,<81.0.0"
pyswisseph = ">=2.10.3.2,<3.0.0.0"
timezonefinder = ">=6.5.9,<7.0.0"
pyjhora = ">=4.5.0,<5.0.0"
geocoder = ">=1.38.1,<2.0.0"

[tool.poetry.group.dev.dependencies]
# Add your development dependencies here
pytest = "^8.4.1"

[tool.poetry.scripts]
calendar-json = "calendar_cli.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
